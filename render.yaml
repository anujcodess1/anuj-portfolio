# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # OPTION 1: Static Site (RECOMMENDED FOR REACT PORTFOLIO)
  # NOTE: Render Static Sites are 100% FREE and NEVER sleep/spin down!
  # ---------------------------------------------------------------------------
  - type: web
    name: anuj-portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # ---------------------------------------------------------------------------
  # OPTION 2: If deployed as a Node Web Service (Free Tier sleeps after 15 min):
  # Uncomment below if you are deploying as a full Web Service instead of Static
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: anuj-portfolio-service
  #   runtime: node
  #   plan: free
  #   buildCommand: npm install && npm run build
  #   startCommand: npx serve -s build -l $PORT
  #   envVars:
  #     - key: NODE_VERSION
  #       value: 20
